<html><head><title>Practice - security code</title>
<style>body{font:15px system-ui;max-width:640px;margin:60px auto}
input{width:40px;height:48px;text-align:center;font-size:20px;margin-right:6px}</style></head>
<body><p>A verification code was sent to you@example.com. Enter the 8-character code.</p>
